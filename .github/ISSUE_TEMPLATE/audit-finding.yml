name: "Audit Finding / Structured Defect"
description: "Concrete defects found during systematic audits, code reviews, or testing. Include evidence and acceptance criteria."
title: "[P?] Brief description (one sentence, include affected component/module)"
labels: ["bug", "frontend"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for recording a defect. Please fill in the structure below. Evidence must include `file:line` references to aid localization.
        Assess priority objectively: P0 blocks functionality / security vulnerability; P1 clearly harms experience or security; P2 moderate; P3 polish.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0-critical (blocks functionality / security vulnerability, must fix immediately)
        - P1-high (high priority, clearly harms experience or security)
        - P2-medium (moderate, experience / consistency issue)
        - P3-low (low priority, polish item)
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Affected Scope
      description: Component / file path or module, e.g. `frontend/src/views/Models.vue` or `engine.go`.
      placeholder: "engine.go"
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What is the defect? What is happening? State the core problem in one sentence if possible.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps
      description: Step-by-step operation instructions. If not reproducible, describe the trigger conditions.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Must include `file:line` references and relevant code snippets. List multiple pieces of evidence together.
        Wrap quoted code in ```.
      placeholder: |
        `frontend/src/views/Downloads.vue:185`
        ```vue
        const searchQuery = ref('bge-small-zh')
        ```
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: The consequences caused by this issue (functionality failure / data loss / security risk / experience harm, etc.).
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Fix Suggestion
      description: Provide a diff or pseudocode. If there are multiple approaches, list A/B with trade-offs.
      placeholder: |
        ```diff
        - foo()
        + bar()
        ```
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Verifiable checklist items, listed as `- [ ]`. Check each item after the fix.
      placeholder: |
        - [ ] Click pause → task status becomes "paused"
        - [ ] Corresponding quality gates pass (go build / gofmt / npm run build)
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: checkboxes
    id: gates
    attributes:
      label: Quality Gates (confirm at fix time)
      description: Per AGENTS.md requirements, relevant changes must pass the corresponding quality gates, and results must be attached in the PR.
      options:
        - label: I confirm this fix requires running [backend / frontend] quality gates, and I will attach results in the PR
          required: false

  - type: input
    id: tracker
    attributes:
      label: Parent Tracker Issue (optional)
      description: If this issue belongs to an audit batch, fill in the Tracker issue number, e.g. #3.
      placeholder: "#3"
    validations:
      required: false
