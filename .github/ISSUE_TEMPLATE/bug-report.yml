name: "Bug 报告"
description: "使用过程中遇到的非预期行为。面向日常报 bug。"
title: "[Bug] 简明描述"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填全信息，便于快速定位。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 描述你看到的现象，以及你原本期望发生什么。
      placeholder: "我看到 ……，但我期望 ……"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 受影响区域
      options:
        - 前端 (frontend)
        - 后端 (backend)
        - 模型管理 / 扫描
        - 模型下载 (HF Mirror)
        - API 服务 / llama-server
        - llama.cpp 安装 / 下载
        - 配置 / 主题
        - 其他
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 操作系统与版本、模型文件（GGUF 名称）、llama.cpp 版本、服务端口、复现频率。
      placeholder: "Windows 11 / qwen2.5-7b-instruct-q4_k_m.gguf / llama.cpp b4466 / 每次必现"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 截图 / 日志
      description: 如有界面截图、API 页服务日志、错误提示，请贴出。注意**先脱敏**（`llama-gui-config.json` 可能含本机路径）。
    validations:
      required: false

  - type: checkboxes
    id: sanitized
    attributes:
      label: 脱敏确认
      options:
        - label: 我已确认本 issue 不含 token、密钥、本机绝对路径等敏感信息
          required: true
