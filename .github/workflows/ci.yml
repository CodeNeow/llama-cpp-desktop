name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check & build
        working-directory: frontend
        run: npm run build
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Upload frontend build (for go:embed)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Unit tests (Go)
        run: go test ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install NSIS (makensis, required by wails build -nsis)
        run: choco install nsis -y --no-progress
      - name: Add makensis to PATH
        shell: pwsh
        run: |
          # choco only updates registry PATH; the current job's process environment does not auto-refresh,
          # dynamically locate makensis and write to $GITHUB_PATH for subsequent steps
          $mk = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}" `
            -Filter makensis.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $mk) { throw 'makensis.exe not found after "choco install nsis"' }
          Write-Host "Found makensis: $($mk.FullName)"
          Add-Content $env:GITHUB_PATH $mk.DirectoryName
      - name: Sync version file from tag
        # Release version uses git tag as sole source: push v* tag writes tag to
        # core/VERSION (embedded at compile time), ensuring in-app version matches release.
        # Non-tag builds (regular push / manual trigger) use repo's core/VERSION default.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "$GITHUB_REF_NAME" > core/VERSION
      - name: Build Windows app (exe + NSIS installer)
        run: wails build -nsis
      - name: Rename artifacts with version
        shell: bash
        run: |
          # version source matches windows job: tag build uses tag (e.g. v0.1.6);
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="$GITHUB_REF_NAME"
          else
            VER="$(cat core/VERSION)"
          fi
          mv build/bin/llama-desktop-amd64-installer.exe "build/bin/llama-desktop-setup-${VER}-windows-amd64.exe"
          ls -la build/bin/
      - name: List build outputs
        shell: bash
        run: ls -la build/bin/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-desktop-windows
          path: |
            build/bin/llama-desktop-setup-*.exe

  build-linux:
    # TEMPORARILY DISABLED: the app is not adapted to Ubuntu yet — do not build
    # or publish .deb artifacts until Linux support lands. Re-enable by removing
    # the `if: false` line below and restoring build-linux in the release job's
    # needs + artifact-count check.
    if: false
    # Build Ubuntu 20.04 / 22.04 / 24.04 .deb packages.
    # Note: GitHub-hosted ubuntu-20.04 runner is retired; all three distros build in their respective
    # ubuntu containers for consistent binary / glibc / dependency versions. 20.04 repo only has
    # libwebkit2gtk-4.0-dev at 2.38 (< 2.40), requiring webkit2_36 tag (wails Go-layer fallback);
    # 22.04 / 24.04 use libwebkit2gtk-4.1-dev, requiring webkit2_41 tag.
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      matrix:
        include:
          - os: "20.04"
            container: ubuntu:20.04
            webkit-dev: libwebkit2gtk-4.0-dev
            webkit-runtime: libwebkit2gtk-4.0-37
            build-tags: "desktop,production,webkit2_36"
          - os: "22.04"
            container: ubuntu:22.04
            webkit-dev: libwebkit2gtk-4.1-dev
            webkit-runtime: libwebkit2gtk-4.1-0
            build-tags: "desktop,production,webkit2_41"
          - os: "24.04"
            container: ubuntu:24.04
            webkit-dev: libwebkit2gtk-4.1-dev
            webkit-runtime: libwebkit2gtk-4.1-0
            build-tags: "desktop,production,webkit2_41"
    container: ${{ matrix.container }}
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Bootstrap Node 20 in container
        # Container image does not preinstall node, but actions/* (checkout / setup-go / artifact) need
        # node runtime; first step must be pure-run Node bootstrap (NodeSource node 20),
        # then actions can be used. 20.04 container is replacement for retired GitHub-hosted runner.
        run: |
          apt-get update
          apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version

      - uses: actions/checkout@v4

      - name: Download frontend build
          # Reuse frontend job's frontend/dist (go:embed compile dependency), Linux build skips npm
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install GTK and WebKit development packages
        # Wails v2 Linux dependencies: build-essential / pkg-config / GTK3 dev packages + WebKit dev packages
        # (webkit-dev provided by matrix; 20.04 is 4.0 series, 22.04 / 24.04 is 4.1 series)
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libgtk-3-dev ${{ matrix.webkit-dev }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Sync version file from tag
        # Same logic as windows job: release version uses git tag as sole source, push v* tag
        # writes core/VERSION (embedded at compile time); non-tag build uses repo default
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "$GITHUB_REF_NAME" > core/VERSION

      - name: Build Linux app
        # Direct go build (go:embed embeds frontend/dist), no wails CLI / npm;
        # 20.04 needs webkit2_36 (libwebkit2gtk-4.0-dev is 2.38, < 2.40,
        # no 2.40-specific C API, wails uses Go-layer http.NoBody fallback),
        # 22.04 / 24.04 need webkit2_41 to match libwebkit2gtk-4.1-dev
        # (wails default #cgo targets webkit2gtk-4.0, 4.1 must explicitly use webkit2_41 tag)
        run: go build -tags "${{ matrix.build-tags }}" -trimpath -o build/bin/llama-desktop .

      - name: Package .deb
        run: |
          # Version source matches windows job: tag build uses tag (e.g. v0.1.6);
          # non-tag build falls back to core/VERSION. deb Version field must not have v prefix.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="$GITHUB_REF_NAME"
          else
            VER="$(cat core/VERSION)"
          fi
          DEBVER="${VER#v}"

          # Assemble pkg/ directory layout: DEBIAN/control + binary + desktop entry
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications

          # Depends uses alternatives to cover 24.04 t64 transition gtk3 rename
          # (libgtk-3-0 -> libgtk-3-0t64); WebKit runtime per distro matrix
          cat > pkg/DEBIAN/control <<EOF
          Package: llama-desktop
          Version: ${DEBVER}
          Architecture: amd64
          Maintainer: CodeNeow
          Description: Local LLM desktop manager powered by llama.cpp
          Depends: libgtk-3-0 | libgtk-3-0t64, ${{ matrix.webkit-runtime }}
          EOF

          cp build/bin/llama-desktop pkg/usr/bin/llama-desktop

          cat > pkg/usr/share/applications/llama-desktop.desktop <<EOF
          [Desktop Entry]
          Name=Llama Desktop
          Exec=llama-desktop
          Type=Application
          Categories=Utility;
          EOF

          # Include app icon when build/appicon.png exists; omit otherwise (see conditional below)
          if [[ -f build/appicon.png ]]; then
            mkdir -p pkg/usr/share/icons/hicolor/256x256/apps
            cp build/appicon.png pkg/usr/share/icons/hicolor/256x256/apps/llama-desktop.png
            echo "Icon=llama-desktop" >> pkg/usr/share/applications/llama-desktop.desktop
          fi

          dpkg-deb --build --root-owner-group pkg
          mv pkg.deb "build/bin/llama-desktop-setup-${VER}-ubuntu${{ matrix.os }}-amd64.deb"
          ls -la build/bin/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-desktop-ubuntu-${{ matrix.os }}
          path: build/bin/llama-desktop-setup-*.deb

  release:
    # Centralized release to avoid build-windows / build-linux jobs competing to create the same Release.
    # Tag push publishes a formal Release, workflow_dispatch publishes a draft preview.
    # build-linux is temporarily disabled (Ubuntu not yet adapted): only the
    # Windows exe is gathered and the artifact count check expects 1.
    runs-on: ubuntu-latest
    needs: [build-windows]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        # Exclude frontend-dist by pattern, only pull release artifacts and merge into one directory:
        # windows 1 exe (linux 3 deb disabled with build-linux)
        uses: actions/download-artifact@v4
        with:
          pattern: llama-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Validate artifact count must be 1 (windows 1 exe; linux 3 deb disabled),
          # fail if missing to avoid incomplete Release
          shopt -s nullglob
          files=(artifacts/*)
          shopt -u nullglob
          [[ ${#files[@]} -eq 1 ]] || { echo "Expected 1 artifacts, found ${#files[@]}"; exit 1; }
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || { echo "Missing artifact: $f"; exit 1; }
          done
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Push v* tag: publish formal Release
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --generate-notes --repo "$GITHUB_REPOSITORY"
          else
            # Manual trigger: create draft Release (draft does not affect formal version)
            gh release create "preview-$GITHUB_RUN_ID" "${files[@]}" \
              --draft --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
