name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check & build
        working-directory: frontend
        run: npm run build
      - name: Upload frontend build (for go:embed)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)"

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build Windows app (exe + NSIS installer)
        run: wails build -nsis
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-gui-windows
          path: |
            build/bin/llama-gui.exe
            build/bin/llama-gui-amd64-setup.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          files=(build/bin/llama-gui.exe build/bin/llama-gui-amd64-setup.exe)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # 推送 v* tag：发布正式 Release
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --generate-notes --repo "$GITHUB_REPOSITORY"
          else
            # 手动触发：创建草稿 Release（draft 不影响正式版本）
            gh release create "preview-$GITHUB_RUN_ID" "${files[@]}" \
              --draft --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
