name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check & build
        working-directory: frontend
        run: npm run build
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Upload frontend build (for go:embed)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Unit tests (Go)
        run: go test ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install NSIS (makensis, required by wails build -nsis)
        run: choco install nsis -y --no-progress
      - name: Add makensis to PATH
        shell: pwsh
        run: |
          # choco 只更新注册表 PATH，当前 job 的进程环境不会自动刷新，
          # 动态定位 makensis 并写入 $GITHUB_PATH 供后续步骤使用
          $mk = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}" `
            -Filter makensis.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $mk) { throw 'makensis.exe not found after "choco install nsis"' }
          Write-Host "Found makensis: $($mk.FullName)"
          Add-Content $env:GITHUB_PATH $mk.DirectoryName
      - name: Sync version file from tag
        # 发布版本以 git tag 为唯一来源：推送 v* tag 时把 tag 写入
        # core/VERSION（编译时 embed），保证应用内版本号与发布版本一致。
        # 非 tag 构建（普通 push / 手动触发）使用仓库中的 core/VERSION 默认值。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "$GITHUB_REF_NAME" > core/VERSION
      - name: Build Windows app (exe + NSIS installer)
        run: wails build -nsis
      - name: List build outputs
        shell: bash
        run: ls -la build/bin/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-gui-windows
          path: |
            build/bin/llama-gui.exe
            build/bin/llama-gui-amd64-installer.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          files=(build/bin/llama-gui.exe build/bin/llama-gui-amd64-installer.exe)
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || { echo "Missing artifact: $f"; exit 1; }
          done
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # 推送 v* tag：发布正式 Release
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --generate-notes --repo "$GITHUB_REPOSITORY"
          else
            # 手动触发：创建草稿 Release（draft 不影响正式版本）
            gh release create "preview-$GITHUB_RUN_ID" "${files[@]}" \
              --draft --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
