name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check & build
        working-directory: frontend
        run: npm run build
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Upload frontend build (for go:embed)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    env:
      # Wails v3 Linux builds are cgo: the default path targets GTK4 (tag `linux && cgo`),
      # `-tags gtk3` selects the GTK3 + WebKit2GTK-4.1 API (supported through the v3.0.x
      # line). Job-level GOFLAGS covers go build / go test AND golangci-lint compilation.
      GOFLAGS: -tags=gtk3
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install GTK / WebKit development packages
        # Wails v3 Linux build is cgo; the gtk3 tag compiles against WebKit2GTK 4.1
        # (ubuntu-latest = 24.04 ships libwebkit2gtk-4.1-dev; gcc/pkg-config preinstalled).
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        run: go build ./...
      - name: Unit tests (Go)
        run: go test ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install wails3 CLI (pinned to the go.mod v3 version)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Install NSIS (makensis, invoked directly on the installer template)
        run: choco install nsis -y --no-progress
      - name: Add makensis to PATH
        shell: pwsh
        run: |
          # choco only updates registry PATH; the current job's process environment does not auto-refresh,
          # dynamically locate makensis and write to $GITHUB_PATH for subsequent steps
          $mk = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}" `
            -Filter makensis.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $mk) { throw 'makensis.exe not found after "choco install nsis"' }
          Write-Host "Found makensis: $($mk.FullName)"
          Add-Content $env:GITHUB_PATH $mk.DirectoryName
      - name: Sync version file from tag
        # Release version uses git tag as sole source: push v* tag writes tag to
        # core/VERSION (embedded at compile time), ensuring in-app version matches release.
        # Non-tag builds (regular push / manual trigger) use repo's core/VERSION default.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "$GITHUB_REF_NAME" > core/VERSION
      - name: Build Windows app (exe via wails3 task build)
        # Repo-root Taskfile.yml `build` task = bindings + frontend + go build; the
        # tag→core/VERSION sync above feeds the embedded version. generate:bindings
        # inside the task runs `go mod tidy` (harmless).
        run: wails3 task build
      - name: Download WebView2 bootstrapper
        # project.nsi's wails.webview2runtime macro embeds tmp/MicrosoftEdgeWebview2Setup.exe.
        # The v2 CLI used to unpack it from its own binary during `wails build -nsis`; with
        # makensis-direct we fetch Microsoft's Evergreen bootstrapper (permanent fwlink).
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/installer/tmp | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124703' -OutFile 'build/windows/installer/tmp/MicrosoftEdgeWebview2Setup.exe'
      - name: Build NSIS installer (makensis directly on build/windows/installer/project.nsi)
        # The committed wails_tools.nsh carries the installer metadata defaults; the product
        # version is overridden from the tag (or core/VERSION on non-tag builds) via -D, since
        # VIProductVersion requires a 4-part numeric version (hence stripping the leading "v").
        # makensis runs from the installer dir, mirroring the template's documented standalone
        # usage so all relative paths (OutFile ..\..\bin\..., binary ..\..\bin\...) resolve there.
        working-directory: build/windows/installer
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="$GITHUB_REF_NAME"; else VER="$(cat ../../core/VERSION)"; fi
          echo "ARTIFACT_VERSION=$VER" >> "$GITHUB_ENV"
          makensis -DARG_WAILS_AMD64_BINARY='..\..\bin\llama-desktop.exe' -DINFO_PRODUCTVERSION="${VER#v}" project.nsi
      - name: Rename artifacts with version
        shell: bash
        run: |
          # ARTIFACT_VERSION was resolved in the installer step: tag build uses the tag
          # (e.g. v0.1.6); non-tag builds fall back to core/VERSION.
          mv build/bin/llama-desktop-amd64-installer.exe "build/bin/llama-desktop-setup-${ARTIFACT_VERSION}-windows-amd64.exe"
          ls -la build/bin/
      - name: List build outputs
        shell: bash
        run: ls -la build/bin/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-desktop-windows
          path: |
            build/bin/llama-desktop-setup-*.exe

  build-linux:
    # TEMPORARILY DISABLED: the app is not adapted to Ubuntu yet — do not build
    # or publish .deb artifacts until Linux support lands. Re-enable by removing
    # the `if: false` line below and restoring build-linux in the release job's
    # needs + artifact-count check.
    if: false
    # Build Ubuntu 20.04 / 22.04 / 24.04 .deb packages.
    # Note: GitHub-hosted ubuntu-20.04 runner is retired; all three distros build in their respective
    # ubuntu containers for consistent binary / glibc / dependency versions. 20.04 repo only has
    # libwebkit2gtk-4.0-dev at 2.38 (< 2.40), requiring webkit2_36 tag (wails Go-layer fallback);
    # 22.04 / 24.04 use libwebkit2gtk-4.1-dev, requiring webkit2_41 tag.
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      matrix:
        include:
          - os: "20.04"
            container: ubuntu:20.04
            webkit-dev: libwebkit2gtk-4.0-dev
            webkit-runtime: libwebkit2gtk-4.0-37
            build-tags: "desktop,production,webkit2_36"
          - os: "22.04"
            container: ubuntu:22.04
            webkit-dev: libwebkit2gtk-4.1-dev
            webkit-runtime: libwebkit2gtk-4.1-0
            build-tags: "desktop,production,webkit2_41"
          - os: "24.04"
            container: ubuntu:24.04
            webkit-dev: libwebkit2gtk-4.1-dev
            webkit-runtime: libwebkit2gtk-4.1-0
            build-tags: "desktop,production,webkit2_41"
    container: ${{ matrix.container }}
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Bootstrap Node 20 in container
        # Container image does not preinstall node, but actions/* (checkout / setup-go / artifact) need
        # node runtime; first step must be pure-run Node bootstrap (NodeSource node 20),
        # then actions can be used. 20.04 container is replacement for retired GitHub-hosted runner.
        run: |
          apt-get update
          apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version

      - uses: actions/checkout@v4

      - name: Download frontend build
          # Reuse frontend job's frontend/dist (go:embed compile dependency), Linux build skips npm
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install GTK and WebKit development packages
        # Wails v2 Linux dependencies: build-essential / pkg-config / GTK3 dev packages + WebKit dev packages
        # (webkit-dev provided by matrix; 20.04 is 4.0 series, 22.04 / 24.04 is 4.1 series)
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libgtk-3-dev ${{ matrix.webkit-dev }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Sync version file from tag
        # Same logic as windows job: release version uses git tag as sole source, push v* tag
        # writes core/VERSION (embedded at compile time); non-tag build uses repo default
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "$GITHUB_REF_NAME" > core/VERSION

      - name: Build Linux app
        # Direct go build (go:embed embeds frontend/dist), no wails CLI / npm;
        # 20.04 needs webkit2_36 (libwebkit2gtk-4.0-dev is 2.38, < 2.40,
        # no 2.40-specific C API, wails uses Go-layer http.NoBody fallback),
        # 22.04 / 24.04 need webkit2_41 to match libwebkit2gtk-4.1-dev
        # (wails default #cgo targets webkit2gtk-4.0, 4.1 must explicitly use webkit2_41 tag)
        run: go build -tags "${{ matrix.build-tags }}" -trimpath -o build/bin/llama-desktop .

      - name: Package .deb
        run: |
          # Version source matches windows job: tag build uses tag (e.g. v0.1.6);
          # non-tag build falls back to core/VERSION. deb Version field must not have v prefix.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="$GITHUB_REF_NAME"
          else
            VER="$(cat core/VERSION)"
          fi
          DEBVER="${VER#v}"

          # Assemble pkg/ directory layout: DEBIAN/control + binary + desktop entry
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications

          # Depends uses alternatives to cover 24.04 t64 transition gtk3 rename
          # (libgtk-3-0 -> libgtk-3-0t64); WebKit runtime per distro matrix
          cat > pkg/DEBIAN/control <<EOF
          Package: llama-desktop
          Version: ${DEBVER}
          Architecture: amd64
          Maintainer: CodeNeow
          Description: Local LLM desktop manager powered by llama.cpp
          Depends: libgtk-3-0 | libgtk-3-0t64, ${{ matrix.webkit-runtime }}
          EOF

          cp build/bin/llama-desktop pkg/usr/bin/llama-desktop

          cat > pkg/usr/share/applications/llama-desktop.desktop <<EOF
          [Desktop Entry]
          Name=Llama Desktop
          Exec=llama-desktop
          Type=Application
          Categories=Utility;
          EOF

          # Include app icon when build/appicon.png exists; omit otherwise (see conditional below)
          if [[ -f build/appicon.png ]]; then
            mkdir -p pkg/usr/share/icons/hicolor/256x256/apps
            cp build/appicon.png pkg/usr/share/icons/hicolor/256x256/apps/llama-desktop.png
            echo "Icon=llama-desktop" >> pkg/usr/share/applications/llama-desktop.desktop
          fi

          dpkg-deb --build --root-owner-group pkg
          mv pkg.deb "build/bin/llama-desktop-setup-${VER}-ubuntu${{ matrix.os }}-amd64.deb"
          ls -la build/bin/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-desktop-ubuntu-${{ matrix.os }}
          path: build/bin/llama-desktop-setup-*.deb

  release:
    # Centralized release to avoid build-windows / build-linux jobs competing to create the same Release.
    # Tag push publishes a formal Release, workflow_dispatch publishes a draft preview.
    # build-linux is temporarily disabled (Ubuntu not yet adapted): only the
    # Windows exe is gathered and the artifact count check expects 1.
    runs-on: ubuntu-latest
    needs: [build-windows]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      # Checkout brings in CHANGELOG.md, the authoritative release-notes source read by the
      # extraction step below (this job originally ran without a repo checkout).
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        # Exclude frontend-dist by pattern, only pull release artifacts and merge into one directory:
        # windows 1 exe (linux 3 deb disabled with build-linux)
        uses: actions/download-artifact@v4
        with:
          pattern: llama-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        # This repo commits directly to main with no PRs, so --generate-notes only aggregates a
        # bare "Full Changelog" compare link. The authoritative notes live in CHANGELOG.md:
        # extract the tagged version's section (from its '## [vX.Y.Z]' heading, exclusive, up to
        # the next '## [v' heading, exclusive) keeping the bilingual '## 中文' / '## English'
        # subsections that the in-app update modal parses.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          # Literal heading match via index() (no regex on the tag name): avoid surprises from
          # characters a tag name could theoretically contain.
          awk -v target="## [$GITHUB_REF_NAME]" '
            /^## \[v/ {
              if (target_found) { exit }
              if ($0 == target || index($0, target" ") == 1) { target_found = 1 }
              next
            }
            target_found { print }
          ' CHANGELOG.md \
            | sed '/./,$!d' > release-notes.md
          # A tag without a CHANGELOG entry would publish an empty Release body — abort instead.
          if [[ ! -s release-notes.md ]]; then
            echo "::error::No CHANGELOG.md entry found for $GITHUB_REF_NAME (expected a '## [$GITHUB_REF_NAME]' heading); add the entry before tagging."
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Validate artifact count must be 1 (windows 1 exe; linux 3 deb disabled),
          # fail if missing to avoid incomplete Release
          shopt -s nullglob
          files=(artifacts/*)
          shopt -u nullglob
          [[ ${#files[@]} -eq 1 ]] || { echo "Expected 1 artifacts, found ${#files[@]}"; exit 1; }
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || { echo "Missing artifact: $f"; exit 1; }
          done
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Push v* tag: publish formal Release. Notes come from CHANGELOG.md (extracted above),
            # not --generate-notes: PR-less direct-to-main repo makes auto-generated notes useless.
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            # Manual trigger: create draft Release (draft does not affect formal version)
            gh release create "preview-$GITHUB_RUN_ID" "${files[@]}" \
              --draft --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
