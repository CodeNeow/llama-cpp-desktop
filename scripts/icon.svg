<?xml version="1.0" encoding="UTF-8"?>
<!--
  Llama Desktop 应用图标源文件（512×512）
  品牌元素与 frontend/src/components/Sidebar.vue 的 logo 一致：
  紫色对角渐变圆角方块 + 白色 llama 脸线条。
  重新生成构建资源：
    1. 渲染为 512×512 PNG（如 sharp/Inkscape/Photoshop）
    2. 覆盖 build/appicon.png 后运行 `wails generate icon`
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 顶部柔光，增加立体感 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- llama 脸（白色线条，圆头圆角） -->
  <g fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 318 L256 128 L352 318"/>
  </g>
  <!-- 下颌 -->
  <circle cx="256" cy="372" r="30" fill="#ffffff"/>
</svg>
