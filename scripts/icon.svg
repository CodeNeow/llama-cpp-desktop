<?xml version="1.0" encoding="UTF-8"?>
<!--
  Llama Desktop app icon source (512x512)
  Brand elements match frontend/src/components/Sidebar.vue logo:
  purple diagonal gradient rounded square + white llama face lines.
  Regenerate build assets:
    1. Render to 512x512 PNG (e.g. sharp/Inkscape/Photoshop)
    2. Overwrite build/appicon.png then run `wails generate icon`
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- top soft glow for depth -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- llama face (white strokes, round head and corners) -->
  <g fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 318 L256 128 L352 318"/>
  </g>
  <!-- jaw -->
  <circle cx="256" cy="372" r="30" fill="#ffffff"/>
</svg>
