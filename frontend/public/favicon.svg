<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- MyLlama brand mark: chibi llama-head mascot on the brand-gradient
       plate (concept: mascot route, docs/branding/icon-mascot-design.html,
       final implementation 2026-09-04). Palette = project tokens: fleece
       #EEF2FF (shade #D7DEFA), face patch #FFFFFF, outline #43377B (~2.5%
       of canvas), eyes #2A2547, inner ear #C9CFF7, blush #F2D8EC; gradient
       ONLY on the plate. Geometry: head+tuft is one silhouette (cloud bumps
       merge into the head contour); ears are short rounded petals leaning
       outward with inner-ear insets, drawn behind the head. The raster PNGs
       (build/appicon.png, build/windows/icon.ico, Android mipmaps) are
       generated from this same geometry. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
