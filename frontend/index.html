<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes the env() safe-area insets (see
         --safe-area-top in global.css); interactive-widget=resizes-content
         keeps the chat composer visible above the Android soft keyboard.
         Pinch zoom is disabled ONLY via MainActivity's WebView zoom settings
         (setSupportZoom(false) + built-in controls off): adding
         maximum-scale/user-scalable here instead makes the WebView stop
         shrinking the layout viewport for the soft keyboard (observed on an
         API 35 WebView with interactive-widget=resizes-content present), so
         the keyboard then covers the chat composer — keep the two mechanisms
         separate. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/appicon.png" />
    <title>Llama Desktop</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
