<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes the env() safe-area insets (see
         --safe-area-top in global.css); interactive-widget=resizes-content
         keeps the chat composer visible above the Android soft keyboard;
         maximum-scale/user-scalable disable pinch zoom (app-like: the page is
         not a zoomable web document — the Android WebView shell additionally
         turns off its own zoom controls, see MainActivity.java) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/appicon.png" />
    <title>Llama Desktop</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
