<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes the env() safe-area insets (see
         --safe-area-top in global.css). NOTE: Android WebViews do not honor
         interactive-widget=resizes-content — the chat composer clears the
         soft keyboard via the safe-area bridge instead (lib/safeArea.ts
         --keyboard-inset, MainActivity insets push). No user-scalable /
         maximum-scale constraints here on purpose: with them this WebView
         skips its IME layout handling for the page entirely; pinch zoom is
         disabled via MainActivity's WebView zoom settings instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/appicon.png" />
    <title>MyLlama</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
