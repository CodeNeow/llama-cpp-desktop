version: '3'

# Wails v3 task runner layout (trimmed from the v3 beta.16 template at
# v3/internal/commands/build_assets/Taskfile.tmpl.yml). `wails3 build` /
# `wails3 dev` wrap these tasks; see build/config.yml for the dev loop.

vars:
  APP_NAME: 'llama-desktop'
  BIN_DIR: 'build/bin'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5173}}'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    cmds:
      - npm install

  generate:bindings:
    summary: Generate TypeScript bindings for the bound core.App service
    deps:
      - task: go:mod:tidy
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - frontend/bindings/**/*
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -clean=true -ts

  build:frontend:
    summary: Type-check (vue-tsc) and build the frontend into dist/
    run: once
    dir: frontend
    sources:
      - '**/*'
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - npm run build

  generate:syso:
    summary: Generate the Windows resource object (exe icon + app manifest) that `go build` links into the exe automatically
    dir: build
    cmds:
      - wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -out ../wails_windows_amd64.syso

  build:
    summary: Production build (embedded frontend, production tag, windowsgui, branded exe icon)
    cmds:
      - task: build:frontend
      - task: generate:syso
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" .
      # The .syso is a transient link input (mirrors the v3 template): remove it
      # after the build so it never lingers in the working tree.
      - cmd: powershell Remove-Item wails_windows_amd64.syso
        platforms: [windows]
      - cmd: rm -f wails_windows_amd64.syso
        platforms: [linux, darwin]

  build:go:dev:
    summary: Compile the Go binary for the dev loop (no production tag so the FRONTEND_DEVSERVER_URL proxy is compiled in; `dev` build tag keeps core/devbuild_dev.go active, mirroring v2's `wails dev`)
    cmds:
      - go build -tags dev -buildvcs=false -gcflags=all="-l" -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" .

  dev:frontend:
    summary: Start the Vite dev server (hot reload)
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      # --host 127.0.0.1: vite's default "localhost" binds IPv6 ::1 only on
      # this stack, while the v3 dev binary's asset proxy dials tcp4 127.0.0.1
      # (the window 502s otherwise).
      - npm run dev -- --port {{.VITE_PORT}} --strictPort --host 127.0.0.1

  run:dev:
    summary: Run the dev-built binary (primary process of the wails3 dev loop)
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  dev:
    summary: Dev loop (Vite hot reload + supervised Go rebuild); task flow lives in build/config.yml
    cmds:
      - wails3 dev -port {{.VITE_PORT}}

  # ---------------------------------------------------------------------------
  # Android (arm64) build — adapted from the v3 beta.16 template's
  # build/android/Taskfile.yml (build -> compile:go:shared -> assemble flow).
  #
  # These tasks only run where the Android SDK + NDK + JDK 17 exist (CI's
  # build-android job installs ndk;26.3.11579264 + platforms;android-35). They
  # are NOT runnable on this repo's primary Windows dev machine (no
  # ANDROID_HOME/NDK; the NDK toolchain host mapping below supports Linux and
  # macOS hosts only). frontend/dist must exist before android:build:go: CI
  # downloads the frontend-dist artifact, locally run `wails3 task
  # build:frontend` first.
  #
  # Product is a debug-signed arm64 APK (gradle assembleDebug → debug keystore
  # signature, no release-keystore secrets in CI); the Go side is still built
  # with `-tags production,android` so the app code is production-parity.
  # ---------------------------------------------------------------------------

  android:build:go:
    summary: Compile the Go app to libwails.so for android/arm64 (NDK clang, c-shared). ABI=x86_64 builds the emulator-smoke variant.
    vars:
      # arm64-v8a is the release ABI for real devices; x86_64 exists solely for
      # CI's emulator smoke (CI emulators are x86_64 and cannot run arm64 libs).
      ABI: '{{.ABI | default "arm64-v8a"}}'
    preconditions:
      - sh: '[ -n "$ANDROID_NDK_HOME" ] || { [ -n "$ANDROID_HOME" ] && ls -d "$ANDROID_HOME"/ndk/* >/dev/null 2>&1; } || { [ -n "$ANDROID_SDK_ROOT" ] && ls -d "$ANDROID_SDK_ROOT"/ndk/* >/dev/null 2>&1; }'
        msg: "Android NDK not found (set ANDROID_NDK_HOME, or install one under $ANDROID_HOME/ndk, e.g. sdkmanager 'ndk;26.3.11579264'). Only runnable on machines with the Android toolchain (CI build-android job)."
      - sh: '[ -f frontend/dist/index.html ]'
        msg: "frontend/dist missing — CI downloads the frontend-dist artifact; locally run `wails3 task build:frontend` first (go:embed dependency)."
    cmds:
      - |
        set -eu
        # Locate the NDK: $ANDROID_NDK_HOME, or the newest installed NDK under
        # the SDK root (mirrors the v3 template's compile:go:shared task).
        NDK_ROOT="$ANDROID_NDK_HOME"
        if [ -z "$NDK_ROOT" ]; then
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          NDK_ROOT=$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)
        fi
        if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
          echo "Error: Android NDK not found"
          echo "Install one with: sdkmanager 'ndk;26.3.11579264' (or set ANDROID_NDK_HOME)"
          exit 1
        fi

        # Prebuilt host tag for the NDK toolchain (CI runners are linux).
        case "$(uname -s)" in
          Darwin) HOST_TAG="darwin-x86_64" ;;
          Linux)  HOST_TAG="linux-x86_64" ;;
          *)      echo "Unsupported host OS for the Android NDK toolchain"; exit 1 ;;
        esac
        TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/$HOST_TAG"

        # GOARCH per target ABI (the two c-shared targets the gradle project
        # packages) and the matching NDK clang (minSdk 21 target).
        case "{{.ABI}}" in
          arm64-v8a) GOARCH=arm64;  CLANG_TRIPLE=aarch64-linux-android21 ;;
          x86_64)    GOARCH=amd64;  CLANG_TRIPLE=x86_64-linux-android21 ;;
          *) echo "Unsupported ABI '{{.ABI}}' (arm64-v8a | x86_64)"; exit 1 ;;
        esac

        # Exact env pattern from the v3 template's compile:go:shared arm64
        # branch: NDK clang as the CGO compiler plus GOOS/GOARCH/CGO_ENABLED.
        export CGO_ENABLED=1
        export GOOS=android
        export GOARCH
        export CC="$TOOLCHAIN/bin/${CLANG_TRIPLE}-clang"
        export CXX="$TOOLCHAIN/bin/${CLANG_TRIPLE}-clang++"

        # Android entry registration lives in the repo-root main_android.go
        # (//go:build android): its init() registers main() with the Wails
        # Android runtime, which a -buildmode=c-shared build never calls on
        # its own — no wails3 overlay/CLI needed.

        # Production-parity Go side (framework diagnostics compiled out);
        # flags mirror the template's PRODUCTION=true build flags.
        mkdir -p build/android/app/src/main/jniLibs/{{.ABI}}
        go build -buildmode=c-shared \
          -tags production,android -trimpath -buildvcs=false -ldflags="-w -s" \
          -o build/android/app/src/main/jniLibs/{{.ABI}}/libwails.so .
        echo "libwails.so built for android/{{.ABI}}"

  android:build:
    summary: Build the debug-signed Android APK (android:build:go + gradle assembleDebug)
    deps:
      - task: android:build:go
    preconditions:
      - sh: 'command -v java >/dev/null || [ -n "$JAVA_HOME" ]'
        msg: "Java not found. Install a JDK 17 and/or set JAVA_HOME (Gradle 9 / AGP 8.7 requirement)."
    cmds:
      - |
        # Debug APK: signed with the auto-generated debug keystore (no
        # signing secrets in CI; installable for sideload testing). Only
        # arm64-v8a is packaged (abiFilters in build/android/app/build.gradle).
        cd build/android
        # Restore the wrapper's exec bit — checkouts/artifacts may drop mode
        # bits (same guard as the v3 template's assemble tasks).
        chmod +x ./gradlew
        ./gradlew assembleDebug
        ls -la app/build/outputs/apk/debug/app-debug.apk
        echo "Debug APK assembled: build/android/app/build/outputs/apk/debug/app-debug.apk"

  android:package:
    summary: Copy the debug APK to build/bin under its versioned release-asset name
    deps:
      - task: android:build
    cmds:
      - |
        # VER = core/VERSION as-is ("v" prefix kept, matching the windows/macos
        # artifact naming). Tag builds run after CI's "Sync version file from
        # tag" step, so VER equals the release tag (e.g. v0.3.9).
        VER="$(cat core/VERSION)"
        mkdir -p build/bin
        cp build/android/app/build/outputs/apk/debug/app-debug.apk \
           "build/bin/llama-desktop-${VER}-android-arm64-debug.apk"
        echo "Packaged: build/bin/llama-desktop-${VER}-android-arm64-debug.apk"
