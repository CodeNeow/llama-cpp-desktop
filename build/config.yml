# Wails v3 dev-mode configuration consumed by `wails3 dev` (see Taskfile.yml).
# Mirrors the v3 beta.16 template: rebuild the Go binary with the `dev` build
# tag (blocking), start Vite (background), then run the binary (primary) —
# the binary proxies assets to the Vite dev server via FRONTEND_DEVSERVER_URL,
# which `wails3 dev` injects automatically.
version: '3'

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watched for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory is excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 task build:go:dev
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task run:dev
      type: primary
