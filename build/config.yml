# Wails v3 dev-mode configuration consumed by `wails3 dev` (see Taskfile.yml).
# Mirrors the v3 beta.16 template, plus one deviation: a blocking wait:frontend
# gate before the binary. The dev binary only retries FRONTEND_DEVSERVER_URL
# for ~5s before a fatal exit, and a cold start (npm install + Vite dep
# re-optimization after a lockfile change) can outrun that window — so poll
# Vite until it answers, then run the binary (see Taskfile.yml wait:frontend).
version: '3'

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watched for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory is excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 task build:go:dev
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task wait:frontend
      type: blocking
    - cmd: wails3 task run:dev
      type: primary
